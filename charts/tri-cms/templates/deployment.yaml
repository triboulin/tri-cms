apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.persistence.enabled }}
  # The PVC is ReadWriteOnce (single SQLite writer): a RollingUpdate would
  # try to start the new pod (and mount the same PVC) before the old one
  # releases it, and get stuck Pending -- true for local-path (node-local)
  # and still true for longhorn RWO volumes (attach/detach isn't
  # simultaneous). Recreate tears the old pod down first -- a few seconds
  # of downtime per deploy, but a rollout that actually completes.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      {{- if and .Values.registry.username .Values.registry.password }}
      imagePullSecrets:
        - name: {{ include "app.name" . }}-registry
      {{- end }}
      containers:
        - name: {{ include "app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          {{- if .Values.env }}
          env:
            {{- range $key, $value := .Values.env }}
            {{- if and $value (eq $key "TRICMS_ENCRYPTION_KEY") }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.name" $ }}-env
                  key: {{ $key }}
            {{- else }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "app.name" . }}-data
      {{- end }}
