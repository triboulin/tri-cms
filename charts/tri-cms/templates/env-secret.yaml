{{- /*
Secrets sensibles (JWT, chiffrement, mot de passe bootstrap) : dans un Secret
dédié plutôt qu'en `env.value` en clair dans le Deployment, pour que leur
lecture nécessite le droit RBAC "get secrets" et pas juste "get pods".
*/}}
{{- if or .Values.env.TRICMS_ENCRYPTION_KEY .Values.env.TRICMS_BOOTSTRAP_PASSWORD }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.name" . }}-env
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.env.TRICMS_ENCRYPTION_KEY }}
  TRICMS_ENCRYPTION_KEY: {{ .Values.env.TRICMS_ENCRYPTION_KEY | quote }}
  {{- end }}
  {{- if .Values.env.TRICMS_BOOTSTRAP_PASSWORD }}
  TRICMS_BOOTSTRAP_PASSWORD: {{ .Values.env.TRICMS_BOOTSTRAP_PASSWORD | quote }}
  {{- end }}
{{- end }}
