{{define "page:login"}}
<!DOCTYPE html>
<html lang="fr">
{{template "partial:head" .}}
<body>
  <div class="tri-login-wrap">
    <div class="tri-card" style="width:320px;">
      <h2 style="margin-top:0;">triCMS</h2>
      {{if .Content.Error}}<div class="tri-error">{{.Content.Error}}</div>{{end}}
      <form class="tri-form" method="post" action="/login">
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Mot de passe</label>
        <input type="password" name="password" required>
        <button class="tri-btn" type="submit">Se connecter</button>
      </form>
    </div>
  </div>
</body>
</html>
{{end}}
