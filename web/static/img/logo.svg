<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 48" role="img" aria-label="triCMS">
  <title>triCMS — logo</title>
  <!-- Trinité : trois cercles entrelacés disposés en triangle -->
  <g fill="none" stroke-width="3.2">
    <circle cx="24" cy="15" r="10" stroke="#2d7ff9"/>
    <circle cx="15" cy="30" r="10" stroke="#7ab3ff"/>
    <circle cx="33" cy="30" r="10" stroke="#1a6ce0"/>
  </g>
  <!-- CMS : lignes de contenu empilées au centre du triangle -->
  <g fill="#1d1f25">
    <rect x="18"   y="20.4" width="12" height="2.2" rx="1.1"/>
    <rect x="19.5" y="23.9" width="9"  height="2.2" rx="1.1"/>
    <rect x="21"   y="27.4" width="6"  height="2.2" rx="1.1"/>
  </g>
  <!-- Wordmark -->
  <text x="54" y="31" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5"><tspan fill="#2d7ff9">tri</tspan><tspan fill="#1d1f25">CMS</tspan></text>
</svg>
